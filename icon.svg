<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fondo Oscuro Profundo -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="70%" stop-color="#080911"/>
      <stop offset="100%" stop-color="#030407"/>
    </radialGradient>

    <!-- Gradientes de Neón para los cortes -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0077"/>
      <stop offset="100%" stop-color="#a800ff"/>
    </linearGradient>

    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbf00"/>
      <stop offset="100%" stop-color="#ff3b00"/>
    </linearGradient>

    <!-- Resplandor / Glow -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base / Fondo de App Icon (Esquinas redondeadas estilo Android) -->
  <rect width="512" height="512" rx="118" fill="url(#bgGlow)"/>
  
  <!-- Borde sutil del icono -->
  <rect width="508" height="508" x="2" y="2" rx="116" fill="none" stroke="#232942" stroke-width="3" opacity="0.6"/>

  <!-- Halo de luz ambiental en el centro -->
  <circle cx="256" cy="256" r="140" fill="#00e5ff" opacity="0.12" filter="url(#coreGlow)"/>

  <!-- GLIFO PRINCIPAL: NÚCLEO GEOMÉTRICO FRAGMENTADO (CORTES NEGATIVOS) -->
  <g filter="url(#coreGlow)" transform="translate(0, 5)">
    <!-- Ala Superior Izquierda (Cian Neón) -->
    <path d="M 240 90 
             L 125 290 
             L 185 290 
             L 240 190 
             L 240 90 Z" 
          fill="url(#neonCyan)"/>

    <!-- Ala Superior Derecha (Magenta Neón) -->
    <path d="M 272 90 
             L 272 190 
             L 327 290 
             L 387 290 
             Z" 
          fill="url(#neonPink)"/>

    <!-- Núcleo Hexagonal Central Flotante (Recortado) -->
    <polygon points="256,220 288,240 288,276 256,296 224,276 224,240" 
             fill="#080911" 
             stroke="#00ffff" 
             stroke-width="7"/>

    <!-- Prisma Inferior (Cierre en V Neón Ámbar/Fuego) -->
    <path d="M 170 330 
             L 256 425 
             L 342 330 
             L 292 330 
             L 256 375 
             L 220 330 Z" 
          fill="url(#neonAmber)"/>

    <!-- Partícula Centella / Núcleo interior puro -->
    <circle cx="256" cy="258" r="7" fill="#ffffff"/>
  </g>

  <!-- Efecto de brillo de lente en la esquina superior -->
  <circle cx="110" cy="110" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="395" cy="140" r="3" fill="#00ffff" opacity="0.6"/>
  <circle cx="130" cy="380" r="2.5" fill="#ff0077" opacity="0.5"/>
</svg>
