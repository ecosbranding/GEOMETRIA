<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Espacial Profundo -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="60%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#020306"/>
    </radialGradient>

    <!-- Resplandor Neón Cian -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Resplandor Suave para Formas de Fondo -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Color Cian del Personaje -->
    <radialGradient id="charCyan" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38f9ff"/>
      <stop offset="70%" stop-color="#00c8f5"/>
      <stop offset="100%" stop-color="#0096c7"/>
    </radialGradient>
  </defs>

  <!-- 1. BASE DEL ICONO DE APP (Bordes redondeados de Android) -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="115" fill="none" stroke="#1f2c44" stroke-width="3" opacity="0.6"/>

  <!-- 2. RETÍCULA DE FONDO (Arena de combate) -->
  <g stroke="#00f2ff" stroke-width="1" opacity="0.07">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- 3. FORMAS SECUNDARIAS ORBITANDO (Profundidad) -->
  <!-- Cuadrado Ámbar (Arriba Izquierda) -->
  <g filter="url(#softGlow)" opacity="0.75" transform="translate(85, 95) rotate(22)">
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#ffb703" stroke="#ffe066" stroke-width="6"/>
  </g>

  <!-- Triángulo Rosa (Arriba Derecha) -->
  <g filter="url(#softGlow)" opacity="0.8" transform="translate(420, 110) rotate(-15)">
    <polygon points="0,-28 26,22 -26,22" fill="#ff2a85" stroke="#ff70a6" stroke-width="6"/>
  </g>

  <!-- Hexágono Morado (Costado) -->
  <g filter="url(#softGlow)" opacity="0.65" transform="translate(435, 295) rotate(10)">
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#9d4edd" stroke="#c77dff" stroke-width="6"/>
  </g>

  <!-- 4. PERSONAJE PROTAGONISTA (CENTRO) -->
  <g transform="translate(256, 195)">
    <!-- Aura de luz exterior -->
    <circle cx="0" cy="0" r="115" fill="#00e5ff" opacity="0.25" filter="url(#neonGlow)"/>

    <!-- Anillo Exterior Blanco Puro Grueso -->
    <circle cx="0" cy="0" r="95" fill="#ffffff" filter="url(#softGlow)"/>

    <!-- Núcleo Interior Cian -->
    <circle cx="0" cy="0" r="68" fill="url(#charCyan)"/>

    <!-- Ojos Blancos Brillantes -->
    <circle cx="-25" cy="-5" r="15" fill="#ffffff"/>
    <circle cx="25" cy="-5" r="15" fill="#ffffff"/>
  </g>

  <!-- 5. TIPOGRAFÍA DE IMPACTO: "GEO" -->
  <g filter="url(#neonGlow)">
    <text x="256" y="425" 
          font-family="'Impact', 'Arial Black', -apple-system, sans-serif" 
          font-size="115" 
          font-weight="900" 
          letter-spacing="8" 
          text-anchor="middle" 
          fill="#ffffff">
      GE<tspan fill="#00e5ff">O</tspan>
    </text>
  </g>

  <!-- Brillo / Destello en el texto -->
  <line x1="160" y1="445" x2="352" y2="445" stroke="#00e5ff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
