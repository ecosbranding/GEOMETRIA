<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" width="100%" height="100%">
  <defs>
    <filter id="neonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00e5ff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tipografía geométrica sólida con sombra neón definida -->
  <text x="225" y="125" 
        font-family="'Impact', 'Arial Black', 'Montserrat Black', sans-serif" 
        font-size="130" 
        font-weight="900" 
        letter-spacing="4" 
        text-anchor="middle"
        filter="url(#neonShadow)">
    <tspan fill="#ffffff">GE</tspan><tspan fill="#00e5ff">O</tspan>
  </text>
</svg>
