<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38f9ff"/>
      <stop offset="85%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0096c7"/>
    </radialGradient>
  </defs>

  <!-- PERSONAJE -->
  <g filter="url(#softGlow)" transform="translate(200, 160)">
    <circle cx="0" cy="0" r="135" fill="#00e5ff" opacity="0.25"/>
    <circle cx="0" cy="0" r="118" fill="#ffffff"/>
    <circle cx="0" cy="0" r="84" fill="url(#bodyGrad)"/>
    <circle cx="-30" cy="-6" r="18" fill="#ffffff"/>
    <circle cx="30" cy="-6" r="18" fill="#ffffff"/>
  </g>

  <!-- NOMBRE GEO NÍTIDO -->
  <text x="200" y="420" 
        font-family="'Impact', 'Arial Black', 'Montserrat Black', sans-serif" 
        font-size="125" 
        font-weight="900" 
        letter-spacing="6" 
        text-anchor="middle">
    <tspan fill="#ffffff">GE</tspan><tspan fill="#00e5ff">O</tspan>
  </text>
</svg>
